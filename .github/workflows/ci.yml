# Автопроверка при каждом push в master (и в pull request): типы, линтер, юнит-тесты, e2e API и браузерные тесты
# на временной базе PostgreSQL прямо в GitHub Actions. Боевая база и секреты не нужны.
# Провал не останавливает выкладку на Vercel (решение владельца): виден красным крестиком на коммите и письмом GitHub.
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tasksflot
  # только для временной базы автопроверки — не секрет
  AUTH_SECRET: ci-only-auth-secret-0123456789abcdef0123456789abcdef
  CRON_SECRET: ci-only-cron-secret
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Типы, линтер, тесты
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tasksflot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: База — миграции, справочники, люди для тестов
        run: |
          npx prisma migrate deploy
          npm run db:seed
          npx tsx scripts/ci-fixtures.ts
      - name: Типы
        # LayoutProps/PageProps генерирует Next в .next/types — без сборки их делает next typegen
        run: |
          npx next typegen
          npx tsc --noEmit
      - name: Линтер
        run: npx eslint --quiet
      - name: Юнит-тесты
        run: npm test
      - name: E2E API
        run: npm run test:e2e

  ui:
    name: Браузерные тесты
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tasksflot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: База
        run: |
          npx prisma migrate deploy
          npm run db:seed
      - name: Браузер Chromium
        run: npx playwright install --with-deps chromium
      - name: Сборка
        run: npm run build
      - name: Браузерные тесты
        run: npm run test:ui
        env:
          UI_BASE_URL: http://localhost:3000
          UI_START: "1"
      - name: Скриншоты и трассы упавших сценариев
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
